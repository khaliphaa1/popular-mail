backend:
  name: git-gateway
  branch: main

media_folder: "src/assets/img/uploads"
public_folder: "/assets/img/uploads"

publish_mode: simple

collections:
  - name: "articles"
    label: "Articles"
    label_singular: "Article"
    folder: "src/content/articles"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Headline", name: "title", widget: "string" }
      - { label: "Subheadline / Dek", name: "dek", widget: "text", required: false }
      - label: "Category"
        name: "category"
        widget: "select"
        options: ["News","Politics","Business","Metro","Kano","Northern Nigeria","World","Entertainment","Sports","Technology","Education","Health","Opinion","Features","Interviews","Videos"]
      - { label: "Author", name: "author", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Featured Image", name: "image", widget: "image" }
      - { label: "Image Caption", name: "caption", widget: "string", required: false }
      - { label: "Mark as Breaking News", name: "breaking", widget: "boolean", default: false }
      - { label: "Feature on Homepage", name: "featured", widget: "boolean", default: false }
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - { label: "Body", name: "body", widget: "markdown" }
      - { label: "Meta Description (SEO)", name: "meta_description", widget: "text", required: false }

  - name: "authors"
    label: "Journalists"
    label_singular: "Journalist"
    folder: "src/content/authors"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Full Name", name: "name", widget: "string" }
      - { label: "Job Title", name: "role", widget: "string" }
      - { label: "Photograph", name: "photo", widget: "image" }
      - { label: "Biography", name: "bio", widget: "text" }
      - label: "Social Links"
        name: "social"
        widget: "list"
        required: false
        fields:
          - { label: "Platform", name: "platform", widget: "string" }
          - { label: "URL", name: "url", widget: "string" }

  - name: "breaking_news"
    label: "Breaking News Ticker"
    files:
      - label: "Ticker Items"
        name: "ticker"
        file: "src/_data/breakingNews.yml"
        fields:
          - label: "Headlines"
            name: "items"
            widget: "list"
            fields:
              - { label: "Text", name: "text", widget: "string" }
              - { label: "Link", name: "link", widget: "string" }

  - name: "settings"
    label: "Site Settings"
    files:
      - label: "Navigation Menu"
        name: "navigation"
        file: "src/_data/navigation.yml"
        fields:
          - label: "Menu Items"
            name: "items"
            widget: "list"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "URL", name: "url", widget: "string" }
      - label: "Footer & Social"
        name: "footer"
        file: "src/_data/footer.yml"
        fields:
          - { label: "About Text", name: "about", widget: "text" }
          - label: "Social Links"
            name: "social"
            widget: "list"
            fields:
              - { label: "Platform", name: "platform", widget: "string" }
              - { label: "URL", name: "url", widget: "string" }
      - label: "Advertisement Slots"
        name: "ads"
        file: "src/_data/ads.yml"
        fields:
          - { label: "Header Ad Code", name: "header_ad", widget: "text", required: false }
          - { label: "Homepage Banner Ad Code", name: "banner_ad", widget: "text", required: false }
          - { label: "Sidebar Ad Code", name: "sidebar_ad", widget: "text", required: false }
          - { label: "In-Article Ad Code", name: "in_article_ad", widget: "text", required: false }
          - { label: "Footer Ad Code", name: "footer_ad", widget: "text", required: false }
      - label: "Newsletter"
        name: "newsletter"
        file: "src/_data/newsletter.yml"
        fields:
          - { label: "Heading", name: "heading", widget: "string", default: "Stay informed" }
          - { label: "Description", name: "description", widget: "string", default: "Get the latest Popular Mail stories delivered to your inbox." }
          - { label: "Provider Embed Code", name: "embed_code", widget: "text", required: false }
